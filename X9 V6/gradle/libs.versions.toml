[versions]
agp = "9.0.1"
coreKtx = "1.18.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.13.0"
constraintlayout = "2.2.1"
kotlin = "2.3.20"
detekt = "1.23.8"
ktlint = "14.2.0"
